<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hello 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:pink;font-family:Arial,sans-serif;overflow:hidden}.box{text-align:center;width:100%;padding:20px}h1{font-size:45px}.buttons{height:220px;position:relative}.btn{border:0;border-radius:15px;padding:15px 28px;font-size:20px;cursor:pointer;transition:transform .2s ease,left .15s ease,top .15s ease}#yes{background:#ff4081;color:white;position:relative;z-index:2}#no{background:white;color:#ff4081;position:fixed;z-index:5;left:calc(50% + 60px);top:calc(50% + 55px)}#second{display:none}.heart{font-size:55px}
</style>
</head>
<body>
<div class="box" id="first">
<div class="heart">💗</div><h1>HELLO</h1>
<div class="buttons"><button class="btn" id="yes">YES ❤️</button></div>
</div>
<button class="btn" id="no">NO 😭</button>
<div class="box" id="second"><div class="heart">💗</div><h1>hiiiii ahhahaa 😭💗</h1></div>
<script>
let count=0;
const yes=document.getElementById('yes'),no=document.getElementById('no');
function moveNo(e){if(e)e.preventDefault();count++;const w=window.innerWidth,h=window.innerHeight;const pad=20;const bw=no.offsetWidth,bh=no.offsetHeight;const x=pad+Math.random()*Math.max(1,w-bw-pad*2);const y=pad+Math.random()*Math.max(1,h-bh-pad*2);no.style.left=x+'px';no.style.top=y+'px';no.style.transform='scale('+Math.max(.04,1-count*.06)+')';yes.style.transform='scale('+(1+Math.min(count,15)*.45)+')';if(count>=15)no.style.opacity='.12'}
no.addEventListener('pointerdown',moveNo);no.addEventListener('click',moveNo);
yes.addEventListener('click',()=>{document.getElementById('first').style.display='none';no.style.display='none';document.getElementById('second').style.display='block'});
</script>
</body></html>
